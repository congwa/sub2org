# sub2org nginx：同源托管 console + 反代 API（免 CORS）。挂载到 /etc/nginx/conf.d/default.conf。
# /v1 的全局限流交给 nginx；/auth 的爆破限流后端已做（双保险可解开下面 limit_req）。

# 限流区（按 IP）。如需启用，在对应 location 内加 limit_req。
# limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
# limit_req_zone $binary_remote_addr zone=auth:10m rate=1r/s;

upstream sub2org_api {
    server sub2org:3300;
}

# WebSocket 升级支持（socket.io worker 长连）：按 Upgrade 头映射 Connection 值。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    # 出证后：把下一行解开做 301 跳 https，并启用下方 443 块。
    # return 301 https://$host$request_uri;

    client_max_body_size 32m;   # 容纳带图请求（base64）；与服务端 max_body_bytes(32MiB) 对齐
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # API 反代（同源）。covers /v1 /auth /admin /payment /worker /healthz /livez /readyz。
    location ~ ^/(v1|auth|admin|payment|worker|healthz|livez|readyz)(/|$) {
        # limit_req zone=api burst=40 nodelay;   # 可选：/v1 全局兜底限流
        proxy_pass http://sub2org_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;            # 覆盖而非追加：客户端伪造的 XFF 不可信
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE / 流式：关闭缓冲，拉长超时（/admin/events、/v1/chat/completions 流式）。
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Prometheus 指标：单独反代 + 内网 allowlist（metrics_token 留空时这是唯一防护）。
    # 按需放开抓取端网段；默认仅内网。设了 metrics_token 也建议保留 allowlist。
    location = /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://sub2org_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;            # 覆盖而非追加：客户端伪造的 XFF 不可信
    }

    # 自托管 CRX 自动更新（off-store）：把 deploy/ext/{*.crx,updates.xml} 静态托管。
    location = /ext/updates.xml {
        root /usr/share/nginx;          # 实际文件 /usr/share/nginx/ext/updates.xml
        default_type text/xml;
        add_header Cache-Control "no-cache" always;
    }
    location ~ ^/ext/.+\.crx$ {
        root /usr/share/nginx;
        default_type application/x-chrome-extension;
        add_header Cache-Control "public, max-age=300" always;
    }

    # Socket.IO WebSocket（worker 长连）。必须在 SPA 兜底之前 + 带 Upgrade/Connection 头，
    # 否则 /socket.io 落到 SPA 返回 index.html → 握手失败 → worker 反复断连。
    location ^~ /socket.io/ {
        proxy_pass http://sub2org_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;            # 覆盖而非追加：客户端伪造的 XFF 不可信
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 350s;
        proxy_send_timeout 350s;
    }

    # console SPA（history 路由回退）。
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}

