server {
    listen 80;
    listen [::]:80;
    server_name chatgpt.sub2.org;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { proxy_pass http://10.88.0.1:18080; proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto http; }
}
