# Migration redirect: preserve ACME renewal for the existing certificate while
# sending every former public route to the ChatGPT gateway portal.
server {
    listen 80;
    listen [::]:80;
    server_name sub2.org www.sub2.org;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://chatgpt.sub2.org$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sub2.org www.sub2.org;
    ssl_certificate /etc/letsencrypt/live/sub2.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sub2.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:sub2org_ssl:10m;
    ssl_session_timeout 1d;
    server_tokens off;
    location / { return 301 https://chatgpt.sub2.org$request_uri; }
}
