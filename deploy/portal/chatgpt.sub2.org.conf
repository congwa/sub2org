server { listen 80; listen [::]:80; server_name chatgpt.sub2.org; location /.well-known/acme-challenge/ { root /var/www/certbot; } location / { return 301 https://chatgpt.sub2.org$request_uri; } }
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chatgpt.sub2.org;
    ssl_certificate /etc/letsencrypt/live/chatgpt.sub2.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chatgpt.sub2.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:sub2org_chatgpt_ssl:10m;
    ssl_session_timeout 1d;
    server_tokens off;
    access_log /var/log/openresty/chatgpt.sub2.org.access.log;
    error_log /var/log/openresty/chatgpt.sub2.org.error.log warn;
    location / { proxy_pass http://10.88.0.1:18080; proxy_http_version 1.1; proxy_set_header Host $http_host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Host $host; proxy_set_header X-Forwarded-Proto https; proxy_read_timeout 120s; proxy_send_timeout 120s; }
}
